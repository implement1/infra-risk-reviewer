# P02 Infrastructure PR Risk Reviewer -- GitHub Actions integration, Mode A (synthetic fixture packages only).
# L3-11 harmless comment added by PR
# G-CI-2 implementation; see ci/README.md. Not deployed: actions must be pinned to verified full commit SHAs
# (replace every PIN_REQUIRED_* placeholder) and the repository settings in ci/deploy/ must be in place first.
# Static checks: ci/tests/wflint.py (L2 invariants 1-11). Required status checks: `review` and `gate`.
name: p02-review
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
concurrency:
  group: p02-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      ack: ${{ steps.adapter.outputs.ack }}
    steps:
      - name: Check out the PR merge commit as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: pr
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the trusted bundle at the PR base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            ci
            src
            schema
      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.16"
      - id: adapter
        name: P02 review (adapter; digest check, diff, staging, P02, summary)
        env:
          P02_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          P02_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ ! -f "$GITHUB_WORKSPACE/trusted/ci/p02ci/__main__.py" ]; then
            printf '%s\n' '## P02 Infrastructure Risk Review -- TECHNICAL FAILURE -- no assessment produced' \
              'The base commit has no P02 adapter (bootstrap pull request); P02 verdict not available. Code owners review this pull request manually.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          PY="$(command -v python3)"
          W="$(mktemp -d "$RUNNER_TEMP/p02cwd.XXXXXX")"
          cd "$W"
          exec env -i PATH="$PATH" PYTHONPATH="$GITHUB_WORKSPACE/trusted/src:$GITHUB_WORKSPACE/trusted/ci" PYTHONDONTWRITEBYTECODE=1 RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" P02_BASE_SHA="$P02_BASE_SHA" P02_HEAD_SHA="$P02_HEAD_SHA" "$PY" -P -s -B -m p02ci --pr-dir "$GITHUB_WORKSPACE/pr" --expect-core-digest f03b50e89db84f1974f82cabbc6e222d341dae4e206de3a32ceb1f7e20fae518 --expect-adapter-digest a512379863b071625825afa65805e45a316a56c57c05799cf5497ea7c6c12b52
  gate:
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: ${{ needs.review.outputs.ack == 'not-required' && 'p02-no-ack' || 'p02-risk-acknowledgement' }}
    steps:
      - run: echo "P02 acknowledgement recorded or not requested"
